# cargo-deny configuration for Ruby Agent
# See https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
unmaintained = "none"
ignore = [
    "RUSTSEC-2026-0459",
    "RUSTSEC-2026-0543",
    "RUSTSEC-2024-0370",
    "RUSTSEC-2024-0429",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "CC0-1.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
