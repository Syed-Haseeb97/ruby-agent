[workspace]
members = [
    "crates/ruby-config",
    "crates/ruby-policy",
    "crates/ruby-platform",
    "crates/ruby-voice",
    "crates/ruby-gemini",
    "crates/ruby-memory",
    "crates/ruby-actions",
    "crates/ruby-mcp",
    "crates/ruby-core",
    "crates/ruby-dictation",
    "crates/ruby-desktop",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Ruby Assistant Team"]
license = "MIT"

[workspace.dependencies]
# Serialization & Types
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ts-rs = "10.1"

# Async & Networking
tokio = { version = "1.43", features = ["full"] }
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
url = "2.5"

# Logging & Error Handling
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.13", features = ["v4", "serde"] }

# Windows Native & System
windows = "0.58"

# Internal Crates
ruby-config = { path = "crates/ruby-config" }
ruby-policy = { path = "crates/ruby-policy" }
ruby-platform = { path = "crates/ruby-platform" }
ruby-voice = { path = "crates/ruby-voice" }
ruby-gemini = { path = "crates/ruby-gemini" }
ruby-memory = { path = "crates/ruby-memory" }
ruby-actions = { path = "crates/ruby-actions" }
ruby-mcp = { path = "crates/ruby-mcp" }
ruby-core = { path = "crates/ruby-core" }
ruby-dictation = { path = "crates/ruby-dictation" }

[workspace.lints.cargo]
unused_dependencies = "allow"
unused_workspace_dependencies = "allow"
