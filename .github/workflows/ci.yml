name: Ruby M0 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-and-test:
    name: Windows Workspace Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Build Frontend Assets
        working-directory: crates/ruby-desktop/frontend
        run: |
          npm ci
          npm run build

      - name: Verify No Private Data In Git
        shell: bash
        run: |
          matches=$(git ls-files | grep -iE "playwright_profile|\.db$" || true)
          if [ -n "$matches" ]; then
            echo "ERROR: Private data or database file tracked in git!"
            echo "$matches"
            exit 1
          fi
          echo "Private data check passed: zero private files tracked in git."

      - name: Run Secret and Security Scanner
        run: python acceptance/secret_scan.py --all

      - name: Run Negative Secret Scanner Verification
        run: python acceptance/test_secret_scanner_negative.py

      - name: Install Audit and Deny Tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Security Audit (cargo-audit)
        shell: pwsh
        run: |
          $advisoryDb = "$env:USERPROFILE\.cargo\advisory-db"
          if (!(Test-Path $advisoryDb)) {
            git clone --depth 1 https://github.com/rustsec/advisory-db.git $advisoryDb
          }
          cargo audit --db $advisoryDb

      - name: Supply-Chain & License Linter (cargo-deny)
        run: cargo deny check

      - name: Verify Code Formatting
        run: cargo fmt --check

      - name: Run Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Workspace Unit & Mood Tests
        run: cargo test --workspace --verbose
