name: Ruby Assistant Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Build Frontend Assets
        working-directory: crates/ruby-desktop/frontend
        run: |
          npm ci
          npm run build

      - name: Verify No Private Data In Git
        shell: bash
        run: |
          matches=$(git ls-files | grep -iE "playwright_profile|\.db$" || true)
          if [ -n "$matches" ]; then
            echo "ERROR: Private data or database file tracked in git!"
            echo "$matches"
            exit 1
          fi
          echo "Private data check clean."

      - name: Run Secret and Security Scanner
        run: python acceptance/secret_scan.py --all

      - name: Run Full Workspace Tests
        run: cargo test --workspace

      - name: Generate Software Bill of Materials (SBOM)
        run: |
          python scripts/generate_sbom.py --output dist/ruby-assistant-sbom.json

      - name: Build Release Binary
        run: cargo build --release -p ruby-desktop

      - name: Build Windows Installer (Tauri Bundle)
        run: |
          npx @tauri-apps/cli build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Generate Checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/ruby-desktop.exe dist/
          if (Test-Path target/release/bundle/nsis) {
            Copy-Item target/release/bundle/nsis/*.exe dist/
          }
          if (Test-Path target/release/bundle/msi) {
            Copy-Item target/release/bundle/msi/*.msi dist/
          }
          Get-ChildItem dist/* -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Append -Encoding utf8 dist/SHA256SUMS.txt
          }

      - name: Create GitHub Release Draft
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          name: "Ruby Assistant ${{ github.ref_name }}"
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
